const descriptions = {"Studies (n=17)": "Core evidence set: 17 identified studies applying or documenting MIKE SHE in environmental-flow assessment.", "Evidence and caveats": "Evidence strength and caveats supporting inclusion decisions, with DOI information where available.", "Screened out (n=50)": "Records screened out during the review, with reasons and verification status.", "Counts": "Summary counts by environmental-flow method family and geographic region."};
let currentSheet = -1;

function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
function highlight(s, q) {
  let x = esc(s);
  if (!q) return x;
  const safe = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return x.replace(new RegExp("(" + safe + ")","ig"),"<mark>$1</mark>");
}

function renderCards(filter="") {
  const q = filter.trim().toLowerCase();
  const el = document.getElementById("cards");
  el.innerHTML = "";
  sheets.forEach((sh,i) => {
    const flat = sh.data.flat().join(" ").toLowerCase();
    if (q && !(sh.name.toLowerCase().includes(q) || flat.includes(q))) return;
    const rows = sh.data.length;
    const cols = sh.data[0]?.length || 0;
    const card = document.createElement("div");
    card.className="card";
    card.onclick=()=>showSheet(i);
    card.innerHTML = `
      <div class="num">SHEET ${i+1}</div>
      <h2>${highlight(sh.name,filter)}</h2>
      <p>${esc(descriptions[sh.name] || "Workbook data sheet.")}</p>
      <div class="badges">
        <span class="badge">${rows ? rows-1 : 0} data rows</span>
        <span class="badge">${cols} columns</span>
      </div>`;
    el.appendChild(card);
  });
}

function showHome() {
  currentSheet=-1;
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("sheetView").classList.add("hidden");
  document.getElementById("globalSearch").value="";
  renderCards();
}

function showSheet(i) {
  currentSheet=i;
  const sh=sheets[i];
  document.getElementById("home").classList.add("hidden");
  document.getElementById("sheetView").classList.remove("hidden");
  document.getElementById("sheetTitle").textContent=sh.name;
  document.getElementById("sheetDesc").textContent=descriptions[sh.name] || "";
  document.getElementById("sheetSearch").value="";
  renderSheet("");
}

function renderSheet(filter="") {
  const sh=sheets[currentSheet];
  const table=document.getElementById("sheetTable");
  table.innerHTML="";
  if(!sh.data.length) return;
  const head=document.createElement("thead");
  const hr=document.createElement("tr");
  sh.data[0].forEach(v=>{const th=document.createElement("th");th.textContent=v;hr.appendChild(th)});
  head.appendChild(hr); table.appendChild(head);
  const q=filter.trim().toLowerCase();
  const body=document.createElement("tbody");
  sh.data.slice(1).forEach(row=>{
    const hay=row.join(" ").toLowerCase();
    if(q && !hay.includes(q)) return;
    const tr=document.createElement("tr");
    row.forEach(v=>{const td=document.createElement("td");td.innerHTML=highlight(v,filter);tr.appendChild(td)});
    body.appendChild(tr);
  });
  table.appendChild(body);
  const shown=body.children.length, total=sh.data.length-1;
  document.getElementById("sheetStats").innerHTML=`
    <div class="stat"><b>${shown}</b><span>rows shown</span></div>
    <div class="stat"><b>${total}</b><span>total data rows</span></div>
    <div class="stat"><b>${sh.data[0].length}</b><span>columns</span></div>`;
}

document.getElementById("globalSearch").addEventListener("input",e=>renderCards(e.target.value));
document.getElementById("sheetSearch").addEventListener("input",e=>renderSheet(e.target.value));
renderCards();
</script>
